<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="title desc">
<title id="title">A circle, a radius and a sine</title><desc id="desc">A radius meets a circle at 35 degrees. The vertical projection is r times sine theta. A reflected point shows the full chord, twice the sine length.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#c4bba3" stroke-width=".5"/></pattern></defs>
<rect x="20" y="20" width="400" height="380" fill="url(#grid)" opacity=".35"/>
<g fill="none" stroke="#898b70" stroke-width="1"><path d="M30 210H400M210 35V385"/><circle cx="210" cy="210" r="145"/><path d="M210 65V355M65 210H355" stroke-dasharray="3 5"/></g>
<path d="M210 210L328.78 126.83V210Z" fill="#9c432c" fill-opacity=".06"/>
<path d="M210 210L328.78 126.83" stroke="#353e32" stroke-width="1.8"/>
<path d="M328.78 126.83V293.17M210 210H328.78" stroke="#9c432c" stroke-width="2"/>
<path d="M210 210L328.78 293.17" fill="none" stroke="#898b70" stroke-dasharray="4 5"/>
<path d="M250 210A40 40 0 0 0 242.77 187.06M318.78 210V200H328.78" fill="none" stroke="#9c432c"/>
<g fill="#9c432c"><circle cx="328.78" cy="126.83" r="3.5"/><circle cx="210" cy="210" r="3"/><circle cx="328.78" cy="293.17" r="3"/></g>
<g font-family="Georgia,serif" font-size="16" fill="#45483c"><text x="192" y="232">O</text><text x="258" y="201">θ</text><text x="257" y="155" font-style="italic">r</text><text x="340" y="171" fill="#9c432c" font-style="italic">r sin θ</text><text x="251" y="233" font-style="italic">r cos θ</text></g>
<text x="210" y="392" text-anchor="middle" font-size="10" font-family="sans-serif" letter-spacing="2" fill="#716c60">I · A STUDY IN MEASUREMENT</text>
</svg>
